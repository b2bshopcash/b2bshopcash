    <script>
        // Display today's date in the timer box format
        function updateTodayDate() {
            const today = new Date();
            const dateNum = String(today.getDate()).padStart(2, '0');
            const allMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const allDays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            const dateNumEl = document.getElementById("date-num");
            const dateMonthEl = document.getElementById("date-month");
            const dateYearEl = document.getElementById("date-year");
            const dateDayEl = document.getElementById("date-day");

            if (dateNumEl) dateNumEl.innerText = dateNum;
            if (dateMonthEl) dateMonthEl.innerText = allMonths[today.getMonth()];
            if (dateYearEl) dateYearEl.innerText = today.getFullYear();
            if (dateDayEl) dateDayEl.innerText = allDays[today.getDay()];
        }

        updateTodayDate();

        // Typing Effect
        const text1 = "Get ready to be ";
        const text2 = "amazed.";
        const typeSpeed = 75; 
        let i1 = 0;
        let i2 = 0;
        const typingEl = document.getElementById('typing-text');

        function typeWriter() {
            if (i1 < text1.length) {
                typingEl.innerHTML = text1.substring(0, i1 + 1) + '<span class="cursor">|</span>';
                i1++;
                setTimeout(typeWriter, typeSpeed);
            } else if (i2 === 0) {
                typingEl.innerHTML = text1 + '<br><span class="highlight"></span><span class="cursor">|</span>';
                i2++;
                setTimeout(typeWriter, typeSpeed);
            } else if (i2 <= text2.length) {
                typingEl.innerHTML = text1 + '<br><span class="highlight">' + text2.substring(0, i2) + '</span><span class="cursor">|</span>';
                i2++;
                setTimeout(typeWriter, typeSpeed);
            } else {
                typingEl.innerHTML = text1 + '<br><span class="highlight">' + text2 + '</span><span class="cursor blink">|</span>';
                // Remove cursor after it blinks a couple times
                setTimeout(() => {
                    typingEl.innerHTML = text1 + '<br><span class="highlight">' + text2 + '</span>';
                }, 1500);
            }
        }

        typeWriter();

        // Randomize Background Colors on Load
        function setRandomGradients() {
            const root = document.documentElement;
            
            // Generate a random HSL color. minL and maxL control how dark/light it is.
            const randHSL = (minL, maxL) => {
                const h = Math.floor(Math.random() * 360);
                const s = 60 + Math.floor(Math.random() * 40); // 60-100% saturation
                const l = minL + Math.floor(Math.random() * (maxL - minL)); // Lightness
                return `hsl(${h}, ${s}%, ${l}%)`;
            };

            // Main Background (Dark colors so text remains readable)
            root.style.setProperty('--bg-color-1', randHSL(10, 25));
            root.style.setProperty('--bg-color-2', randHSL(10, 25));
            root.style.setProperty('--bg-color-3', randHSL(10, 25));
            root.style.setProperty('--bg-color-4', randHSL(10, 25));

            // Floating Spheres (Brighter, vibrant colors for the glowing effect)
            root.style.setProperty('--sphere-1-color', randHSL(45, 65));
            root.style.setProperty('--sphere-2-color', randHSL(45, 65));
            root.style.setProperty('--sphere-3-color', randHSL(45, 65));
        }

        // Apply immediately
        setRandomGradients();

        // AJAX Form Submission Logic
        const form = document.getElementById('notify-form');
        const formMessage = document.getElementById('form-message');
        const notifyBtn = document.getElementById('notify-btn');

        if(form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Show loading state
                const originalBtnText = notifyBtn.innerText;
                notifyBtn.innerText = 'Sending...';
                notifyBtn.disabled = true;

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if(data.success || data.ok) {
                        form.style.display = 'none';
                        formMessage.style.display = 'block';
                        formMessage.style.color = '#10b981'; // Green
                        formMessage.innerHTML = '✨ Thanks for subscribing! We will notify you when we launch.';
                    } else {
                        throw new Error('FormSubmit error');
                    }
                })
                .catch(error => {
                    formMessage.style.display = 'block';
                    formMessage.style.color = '#ef4444'; // Red
                    formMessage.innerHTML = 'Oops! Something went wrong. Please try again.';
                    notifyBtn.innerText = originalBtnText;
                    notifyBtn.disabled = false;
                });
            });
        }
    </script>
